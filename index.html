<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pulse Analytics - demo SaaS analytics dashboard (fictional data) built with React, TypeScript and Tailwind CSS."
    />
    <meta name="theme-color" content="#4f46e5" />
    <title>Pulse Analytics - SaaS Dashboard Demo</title>
    <script>
      // Apply theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('pulse.theme') || 'system';
          var dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
